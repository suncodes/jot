name: 问题反馈
description: 使用虚构资料描述可复现的问题
body:
  - type: markdown
    attributes:
      value: 请勿附上密钥、私人笔记、数据库或未脱敏日志。安全漏洞请先阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: Jot 版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用最少步骤和虚构数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选的脱敏截图或错误信息。
